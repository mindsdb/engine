name: Test pull request

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - 'main'
      - 'releases/*'

# Cancel any existing runs of this workflow on the same branch/pr
# We always want to test a new commit over an older one
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:

  changes:
    name: Filter changed files
    runs-on: ubuntu-latest
    outputs:
      not-docs: ${{ steps.filter.outputs.not-docs }}
    steps:
      # A pull request that changes only docs, images or Markdown skips the unit
      # tests. Every other change runs them, including a version bump, because
      # setup.py builds the package from mindsdb/__about__.py.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            not-docs:
              - '!docs/**'
              - '!assets/**'  
              - '!**/*.md'

  run_unit_tests:
    name: Run Unit Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.not-docs == 'true' }}
    # tests_unit.yml asks for these permissions itself, and a called workflow
    # can only keep or lower what the job that calls it grants.
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: ./.github/workflows/tests_unit.yml

  # This is a collection point for all of the matrix tests above so we can have a single required job
  tests_completed:
    name: All Tests Succeeded
    needs: [run_unit_tests, changes]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: fail if tests failed or didnt run
        if: ${{ needs.changes.result != 'success' || (needs.changes.outputs.not-docs == 'true' && needs.run_unit_tests.result != 'success') }}
        run: exit 1
      - run: echo "Tests ran successfully"
